<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全車系 - LUXURY AUTO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-models"> <!-- 加上特定 class 讓背景保持黑色 -->
    <nav id="navbar" class="scrolled"> <!-- 內頁的導覽列預設就是深色背景 -->
        <div class="logo"><a href="index.html" style="color: white; text-decoration: none;">LUXURY AUTO</a></div>
        
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <ul class="nav-links" id="nav-links">
            <li><a href="models.html" style="color: #b0a171;">全車系</a></li>
            <li><a href="#">品牌故事</a></li>
            <li><a href="#">極致生活</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <!-- 內頁的主要內容區塊 -->
    <section class="models-section">
        <h1 class="section-title">THE MODELS</h1>
        <p class="section-subtitle">探索工程與藝術的完美結晶</p>
        
        <div class="models-grid">
            <!-- 車款 1 -->
            <div class="model-card">
                <!-- 這裡使用維基百科的穩定圖片作為示範 -->
                <img src="Xiaomi%20SU7%20Ultra%20(Electric).jpg" alt="車款 1">
                <div class="model-info">
                    <h3>Xiaomi SU7 Ultra (純電)</h3>
                    <p>1,548 匹馬力 | 0-100 km/h 1.98秒</p>
                    <button class="cta-button">了解詳情</button>
                </div>
            </div>
            
            <!-- 車款 2 -->
            <div class="model-card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Bugatti_Chiron_%2836559710091%29.jpg/800px-Bugatti_Chiron_%2836559710091%29.jpg" alt="車款 2">
                <div class="model-info">
                    <h3>Xiaomi SU7 Ultra (純電)</h3>
                    <p>1,200 匹馬力 | 極致奢華巡航</p>
                    <button class="cta-button">了解詳情</button>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
